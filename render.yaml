# Beral Care backend. The service keeps its original name: renaming it on
# Render would create a new service and change the API address that the web
# app and the USSD gateway already point at.
services:
  - type: web
    name: beral-care-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: node backend-server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SEED_SAMPLE_DATA
        value: "false"
      - key: JWT_TOKEN
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        sync: false
      - key: DB_SETUP_KEY
        generateValue: true
